services:
  postgres:
    image: postgres:16
    container_name: postgres-iot
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_db}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
    ports:
      - "5432:5432"
    volumes:
      - postgres_iot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_iot_data:
